name: PTOSS Backend Tests

on:
  workflow_dispatch:
    inputs:
      test_paths:
        description: "Space-separated pytest paths for the PTOSS suite"
        required: false
        default: "tests/unit_tests/utils/urls_tests.py tests/unit_tests/utils/version_tests.py"
      coverage_modules:
        description: "Space-separated Python modules to include in coverage"
        required: false
        default: "superset.utils.urls superset.utils.version"
  push:
    branches:
      - "ptoss-*"
      - "feat/ptoss-*"
    paths:
      - "superset/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/ptoss-backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SUPERSET_TESTENV: true
      SUPERSET_SECRET_KEY: not-a-secret
      DEFAULT_PTOSS_TEST_PATHS: "tests/unit_tests/utils/urls_tests.py tests/unit_tests/utils/version_tests.py"
      DEFAULT_PTOSS_COVERAGE_MODULES: "superset.utils.urls superset.utils.version"
      PTOSS_TEST_PATHS: ${{ github.event.inputs.test_paths }}
      PTOSS_COVERAGE_MODULES: ${{ github.event.inputs.coverage_modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python backend
        uses: ./.github/actions/setup-backend/
        with:
          python-version: previous

      - name: Syntax check
        run: |
          TEST_PATHS="${PTOSS_TEST_PATHS:-$DEFAULT_PTOSS_TEST_PATHS}"

          python -m py_compile \
            superset/utils/urls.py \
            tests/unit_tests/utils/conftest.py

          declare -A checked_files=()
          for target in $TEST_PATHS; do
            file="${target%%::*}"
            if [[ "$file" == *.py && -z "${checked_files[$file]:-}" ]]; then
              python -m py_compile "$file"
              checked_files[$file]=1
            fi
          done

      - name: Run PTOSS unit tests with coverage
        run: |
          TEST_PATHS="${PTOSS_TEST_PATHS:-$DEFAULT_PTOSS_TEST_PATHS}"
          COVERAGE_MODULES="${PTOSS_COVERAGE_MODULES:-$DEFAULT_PTOSS_COVERAGE_MODULES}"

          COV_ARGS=()
          for module in $COVERAGE_MODULES; do
            COV_ARGS+=("--cov=$module")
          done

          python -m pytest -q \
            -p pytest_cov.plugin \
            --confcutdir=tests/unit_tests/utils \
            $TEST_PATHS \
            "${COV_ARGS[@]}" \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --maxfail=1 \
            --tb=short \
            --disable-warnings

      - name: Add coverage summary
        run: |
          TEST_PATHS="${PTOSS_TEST_PATHS:-$DEFAULT_PTOSS_TEST_PATHS}"
          COVERAGE_MODULES="${PTOSS_COVERAGE_MODULES:-$DEFAULT_PTOSS_COVERAGE_MODULES}"

          {
            echo "## PTOSS coverage"
            echo
            echo "**Test paths:** \`$TEST_PATHS\`"
            echo
            echo "**Coverage modules:** \`$COVERAGE_MODULES\`"
            echo
            echo '```text'
            python -m coverage report --show-missing
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptoss-coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
